[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uaqe"
version = "1.0.0"
description = "Universal AI Quantization Engine (UAQE)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "flatbuffers>=24.0.0",
    "tensorflow>=2.15.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "safetensors>=0.4.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "starlette>=0.36.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
cpu = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]
